global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'distqueue_worker'
    # Use DNS Service Discovery (dns_sd_configs) instead of static_configs
    # for the worker. A static_configs target (e.g., 'worker:9100') resolves
    # to a single IP. Since the worker service is scaled to multiple replicas,
    # dns_sd_configs queries Docker's DNS for all A records associated with
    # 'worker' and dynamically scrapes all the scaled instances.
    dns_sd_configs:
      - names:
          - worker
        type: A
        port: 9100
        refresh_interval: 15s

  # The scheduler and monitor are single-instance by design, so standard 
  # static_configs hostname resolution is sufficient here. (No need for DNS SD)
  - job_name: 'distqueue_scheduler'
    static_configs:
      - targets: ['scheduler:9100']

  - job_name: 'distqueue_monitor'
    static_configs:
      - targets: ['monitor:9100']
