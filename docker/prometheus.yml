global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Every role uses DNS service discovery (dns_sd_configs) rather than
# static_configs.  A static target like 'worker:9100' resolves to ONE
# container's IP; Docker's embedded DNS returns an A record per replica, so
# DNS SD scrapes every replica — including ones added later with
# `--scale worker=N` (picked up on the next refresh).  Schedulers run as two
# replicas too, so they need it as much as workers do.
scrape_configs:
  - job_name: distqueue_worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
        refresh_interval: 15s

  - job_name: distqueue_scheduler
    dns_sd_configs:
      - names: [scheduler]
        type: A
        port: 9100
        refresh_interval: 15s

  - job_name: distqueue_monitor
    dns_sd_configs:
      - names: [monitor]
        type: A
        port: 9100
        refresh_interval: 15s

  # Only resolves when the stack runs with `--profile demo`; otherwise the
  # job simply has no targets.
  - job_name: distqueue_producer
    dns_sd_configs:
      - names: [producer]
        type: A
        port: 9100
        refresh_interval: 15s
